name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Automatically cancel running builds on the same branch if a new commit drops
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Verify Code Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Strict Types (TypeScript)
        run: bun run typecheck

      - name: Validate Production Build Compilation (Vite)
        run: bun run build